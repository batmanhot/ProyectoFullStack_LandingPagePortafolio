<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- "Blueprint Badge" — mismo mark que el logo del header (ver Header.jsx).
       Letras JP dibujadas con fuente de sistema (no Sora): los navegadores
       renderizan favicons SVG sin cargar @font-face externas. -->
  <rect width="32" height="32" rx="7" fill="#0a0e1a" />
  <rect
    x="8.2"
    y="8.2"
    width="15.6"
    height="15.6"
    rx="2"
    fill="#12172b"
    stroke="#5eead4"
    stroke-width="1.4"
    transform="rotate(45 16 16)"
  />
  <text
    x="16"
    y="17.3"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="9.5"
    fill="#5eead4"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-0.3"
  >JP</text>
  <rect x="12.5" y="20" width="7" height="1" fill="#5eead4" />
</svg>
